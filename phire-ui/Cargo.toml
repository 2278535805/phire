[package]
name = "phire-ui"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["play"]
closed = ["phire/closed"]
chat = []
aa = []
play = ["phire/play"]

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
cacache = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
lru = { workspace = true }
lyon = { workspace = true }
macroquad = { workspace = true }
md5 = { workspace = true }
nalgebra = { workspace = true }
once_cell = { workspace = true }
pollster = { workspace = true }
phire = { workspace = true, features = ["log", "video"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "gzip", "charset", "http2", "system-proxy", "native-tls", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
tap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

phira-mp-client = { workspace = true }
phira-mp-common = { workspace = true }
uuid = { workspace = true }
logos = { workspace = true }
hmac = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { workspace = true }
ndk-context = { workspace = true }
sasa = { workspace = true, default-features = false, features = ["oboe"] }
openssl = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
sasa = { workspace = true, default-features = false, features = ["wasapi"]  }

[target.'cfg(not(any(target_os = "android", target_os = "windows")))'.dependencies]
sasa = { workspace = true, default-features = false, features = ["cpal"]  }

[target.'cfg(target_os = "ios")'.dependencies]
objc = { workspace = true }
objc-foundation = { workspace = true }

[build-dependencies]
dotenv-build = { workspace = true }
