[package]
name = "phire-ui"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["play"]
closed = ["phire/closed"]
chat = []
aa = []
play = []

[dependencies]
anyhow = "1.0"
arc-swap = "1.6.0"
base64 = "0.22.1"
bitflags = "2.2.1"
bytes = "1.4.0"
cacache = { version = "*", default-features = false, features = ["tokio-runtime"] }
chrono = { version = "0.4.23", features = ["serde"] }
futures-util = "0.3.25"
hex = "0.4.3"
image = "*"
lru = "0.16.0"
lyon = "*"
macroquad = { git = "https://github.com/2278535805/prpr-macroquad", default-features = false }
md5 = "0.7"
nalgebra = "*"
once_cell = "*"
pollster = "0.2.5"
phire = { path = "../phire" }
rand = "0.9.2"
regex = "1.7.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "gzip", "charset", "http2", "system-proxy", "rustls", "query"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "0.9.33"
sha2 = "*"
smallvec = "1.10.0"
tap = "1.0.1"
tokio = { version = "*", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.37"
walkdir = "2.3.3"
zip = "4.6.1"
zstd = "0.13.3"

phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp" }
uuid = { version = "1.3.3", features = ["v4"] }
logos = "0.13.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.2"
ndk-context = "0.1"
sasa = { git = "https://github.com/2278535805/sasa", default-features = false, features = ["oboe"] }
openssl = { version = "*", features = ["vendored"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
sasa = { git = "https://github.com/2278535805/sasa" }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "*"
objc-foundation = "*"

[build-dependencies]
dotenv-build = "0.1"
