[package]
name = "prpr-avc"
version = "0.1.0"
edition = "2021"

[lib]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
sasa = { workspace = true, default-features = false, features = ["oboe"] }

[target.'cfg(target_os = "windows")'.dependencies]
sasa = { workspace = true, default-features = false, features = ["wasapi"]  }

[target.'cfg(not(any(target_os = "android", target_os = "windows")))'.dependencies]
sasa = { workspace = true, default-features = false, features = ["cpal"]  }
