[workspace]
members = [
	"phire",
	"prpr-avc",
	"prpr-pbc",
	"phire-ui",
	"phire-main",
]
resolver = "2"

[profile.release]
opt-level = 2
strip = true

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
phire = { path = "phire" }
macroquad = { git = "https://github.com/2278535805/macroquad" }
phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp" }
sasa = { git = "https://github.com/2278535805/sasa", default-features = false }

anyhow = "1.0.78"
arc-swap = "1.6.0"
async-trait = "0.1.76"
base64 = "0.22.1"
bitflags = { version = "2.2.1", features = ["serde"] }
block = "0.1.6"
byteorder = "1.4.3"
bytes = "1.4.0"
cacache = { version = "13.1.0", default-features = false, features = ["tokio-runtime"] }
cfg-if = "1.0.0"
chardetng = "0.1.17"
chinese-number = "0.7.7"
chrono = { version = "0.4.24", features = ["serde"] }
color-thief = "0.2.2"
colored = "2.0.0"
concat-string = "1.0.1"
csv = "1.1.6"
dotenv-build = "0.1"
fastblur = "0.1.1"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.25"
glyph_brush = "0.7.12"
hex = "0.4.3"
hmac = "0.12.1"
image = "0.24"
intl-memoizer = "0.5.1"
js-sys = "0.3.85"
lazy_static = "1.5.0"
libc = "0.2.142"
logos = "0.13.0"
lru = "0.16.0"
lyon = "1.0.1"
md5 = "0.7"
miniz_oxide = "0.8.9"
nalgebra = "0.34.0"
ndk-context = "0.1"
ndk-sys = "0.2"
obfstr = "=0.4.1"
objc = "0.2.7"
objc-foundation = "0.1.1"
objc_id = "0.1.1"
once_cell = "1.16.0"
open = "5.3.2"
openssl = "0.10.73"
ordered-float = "3.4.0"
phf = { version = "0.13.1", features = ["macros"] }
pollster = "0.3.0"
rand = "0.9.2"
rand_pcg = "0.9.0"
rayon = "1.7.0"
regex = "1.7.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "gzip", "charset", "http2", "system-proxy", "native-tls", "query"] }
rfd = { version = "0.15.3", default-features = false, features = ["gtk3"] }
rustc-hash = "2.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
sha2 = "0.10.6"
smallvec = "1.10.0"
subtle = "2.4.1"
symphonia = { version = "0.5", features = ["flac", "mp3", "ogg", "vorbis", "wav", "pcm"] }
sys-locale = "0.3.2"
tap = "1.0.1"
tempfile = "3.3.0"
thiserror = "2.0.18"
tokio = { version = "1.23" }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = { version = "0.9.1", features = ["macros"] }
uuid = { version = "1.3.3", features = ["v4"] }
walkdir = "2.3.3"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Performance", "UrlSearchParams", "Window"] }
zip = "4.6.1"
zstd = "0.13.3"
zeroize = "1.9.0"
